# The ration#35 sweep's plant pass. Temporary: removed from the branch before
# it merges. One job per plant in `.github/plants/plants.json`, and two
# controls that plant nothing. Each job runs the whole suite against a real
# Postgres, as the `tests` job does, and uploads its JUnit report, its log and
# its exit code. Which cases a plant turns red is read from the reports.
name: plants

on:
  push:
    branches: [claude/ration35-sweep-d094ee]

permissions:
  contents: read

jobs:
  list:
    name: list
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: ids
        run: |
          python -c "import json; ids = ['control-1', 'control-2'] + [p['id'] for p in json.load(open('.github/plants/plants.json'))]; print('ids=' + json.dumps(ids))" >> "$GITHUB_OUTPUT"

  plant:
    name: plant
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        id: ${{ fromJSON(needs.list.outputs.ids) }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ration
          POSTGRES_PASSWORD: ration
          POSTGRES_DB: ration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RATION_POSTGRES_DSN: postgresql://ration:ration@localhost:5432/ration
      RATION_REQUIRE_POSTGRES: "1"
      PLANT: ${{ matrix.id }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Plant
        run: python .github/plants/apply.py "$PLANT"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: The suite, under the plant
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          git diff --stat > "$RUNNER_TEMP/out/diff.txt"
          set +e
          timeout 600 python -m pytest -p no:cacheprovider --junitxml="$RUNNER_TEMP/out/junit.xml" > "$RUNNER_TEMP/out/log.txt" 2>&1
          echo "$?" > "$RUNNER_TEMP/out/exit.txt"
          tail -3 "$RUNNER_TEMP/out/log.txt"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plant-${{ matrix.id }}
          path: ${{ runner.temp }}/out
          retention-days: 30
